# Build and publish a Blockscout frontend image for the crynux-network fork.
# Official publish-image.yml cannot be reused as-is: it pushes to
# ghcr.io/blockscout, uses the org `build` runner, and needs ARM host secrets.
name: Publish frontend image (local fork)

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Optional git ref to build (tag/branch/SHA). Empty uses the workflow run ref.
        required: false
        type: string
      release_version:
        description: Image version tag (for example v2.11.5).
        required: false
        type: string
        default: "v2.11.5"

permissions:
  contents: read
  packages: write

env:
  RELEASE_VERSION: ${{ inputs.release_version || 'v2.11.5' }}
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/blockscout-frontend

jobs:
  push_to_registry:
    name: Push Docker image to GitHub Container Registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref != '' && inputs.git_ref || github.ref }}

      - name: Add SHORT_SHA
        run: echo "SHORT_SHA=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"

      - name: Select Dockerfile
        id: dockerfile
        run: |
          set -euo pipefail
          if [ -f Dockerfile.local ]; then
            echo "file=./Dockerfile.local" >> "$GITHUB_OUTPUT"
          else
            # Tag checkouts that predate Dockerfile.local still need LF scripts.
            find . -type f -name '*.sh' -print0 | xargs -0 sed -i 's/\r$//'
            echo "file=./Dockerfile" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.dockerfile.outputs.file }}
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}-commit.${{ env.SHORT_SHA }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT_SHA=${{ env.SHORT_SHA }}
            GIT_TAG=${{ env.RELEASE_VERSION }}
